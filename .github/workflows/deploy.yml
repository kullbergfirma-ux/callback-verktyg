name: Deploy to Netlify

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Write Netlify site link
        run: |
          mkdir -p .netlify
          echo '{"siteId":"${{ secrets.NETLIFY_SITE_ID }}"}' > .netlify/state.json

      - name: Deploy to Netlify
        run: npx netlify-cli deploy --prod --dir=. --functions=netlify/functions
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
